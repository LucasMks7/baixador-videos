[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baixador-videos"
description = "Ferramenta minimalista para baixar vídeos em MP4 ou extrair o áudio em MP3 ou WAV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Marques de Assis" }]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baixar = "baixador.cli:main"

# Como gui-script, o Windows abre a janela sem um terminal junto.
[project.gui-scripts]
baixar-janela = "baixador.janela:main"

[tool.setuptools.dynamic]
version = { attr = "baixador.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
